  --accent:#3FB57A; --accent-ink:#06140C; --accent-soft:#1D3A2B; --accent-soft-ink:#A9E3C4;

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;

button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--warn-line);outline-offset:2px}
.app{max-width:430px;min-height:100vh;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}

.banner .btn{min-height:44px;border-color:var(--warn-ink);background:var(--surface);color:var(--ink)}

.top{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}

.pill{flex:none;background:var(--accent-soft);color:var(--accent-soft-ink);font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px}
main{flex:1;min-width:0;padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

.plr .nm{flex:1;min-width:0;font-weight:600}
.tbl{overflow-x:auto}
.srow{display:grid;grid-template-columns:28px minmax(80px,1fr) 38px 26px 26px 26px 26px;gap:6px;align-items:center;font-variant-numeric:tabular-nums;min-width:340px}
.srow>:nth-child(n+3){text-align:right}
.srow.h{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:0 10px}
.srow.b{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px}
.clock{background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}

.bar{display:block;height:6px;border-radius:3px;background:var(--line)}
.bar i{display:block;height:6px;border-radius:3px;background:var(--accent)}
.act{background:var(--surface);border:2px solid var(--warn-line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.act .four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.act .four button{min-height:44px;border-radius:10px;border:none;font-size:13px;font-weight:700}
.log{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.log small{flex:none;width:34px;font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted)}
.log span:last-child{flex:1;min-width:0;font-size:14px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld select{width:100%;min-height:44px;border:1px solid var(--field);border-radius:12px;padding:0 12px;background:var(--surface);color:var(--ink);font-size:16px;font-weight:400}
.fchip{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);max-width:290px;min-width:0}
.msg a{color:var(--accent);text-decoration:underline;overflow-wrap:anywhere}
.emo-b{min-width:44px;min-height:44px;background:none;border:none;border-radius:12px;font-size:22px;line-height:1;padding:0}
.emo-b.on{background:var(--accent-soft)}
.bub{display:flex;flex-direction:column;gap:4px;align-items:inherit;max-width:100%;cursor:pointer}
.msg.me .bub{align-items:flex-end}
.msg.sel span{outline:2px solid var(--accent)}
.msgbar{align-items:center;gap:2px}
.quote{max-width:290px;padding:6px 10px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:8px;font-size:12px;overflow-wrap:anywhere}
.rx{display:flex;gap:4px;flex-wrap:wrap}
.rxc{padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px}
.replybar{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 10px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:8px}
.attach{flex:none;min-width:44px;font-size:20px;font-weight:700}
.mimg{display:block;width:100%;max-width:240px;height:auto;border-radius:14px;border:1px solid var(--line)}
.fld textarea{width:100%;min-height:44px;border:1px solid var(--field);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:16px;font-weight:400;line-height:1.4;resize:none;overflow:hidden}
.fld .cnt{font-weight:400;font-size:12px;color:var(--muted);align-self:flex-end}
main,.top{overflow-wrap:anywhere}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.compose input{font-size:16px}
.pitch{position:relative;width:100%;aspect-ratio:3/4;background:var(--pitch);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.pl{position:absolute;display:block;border:2px solid rgba(255,255,255,.55)}
.pl-mid{left:0;right:0;top:50%;border-width:2px 0 0}
.pl-circ{left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%}
.pl-box.t{left:25%;right:25%;top:0;height:13%;border-top:0}
.pl-box.b{left:25%;right:25%;bottom:0;height:13%;border-bottom:0}
.slot{position:absolute;transform:translate(-50%,-50%);width:56px;min-height:44px;background:none;border:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.slot .c{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border:2px dashed rgba(255,255,255,.9);color:#fff}
.slot.on .c{background:#fff;color:#14211A;border:2px solid #fff}
.slot.sel .c{outline:3px solid var(--yellow);outline-offset:2px}
.slot .n{font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.55);border-radius:6px;padding:1px 5px;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;min-height:52px;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav button[aria-current="page"]{color:var(--accent)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmt(t){var m=Math.floor(t/60),r=t%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;}

  function tfmt(t){var a=String(t||'00:00').split(':'),h=+a[0];return ((h%12)||12)+':'+a[1]+(h<12?' AM':' PM');}
  function sortedEvents(){return S.events.slice().sort(function(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1;});}
  function nextGame(){return sortedEvents().filter(function(e){return e.type==='Game'&&!e.result;})[0]||null;}
  function evById(id){return S.events.filter(function(e){return e.id===id;})[0]||null;}
  function dutyPeople(){return [ME].concat(S.players.filter(function(p){return !p.mine;}).map(function(p){return p.name+"'s family";})).concat(['Coach']);}

  function home(){
    var e=nextGame(),leo=mineP();
    var pend=S.events.filter(function(x){return !x.result&&(!S.rsvp[x.id]||S.rsvp[x.id]==='pending');}).length;
    var last=S.msgs.team.slice(-2).map(function(m){return '<div><small class="muted"><b>'+esc(m.w)+' · '+esc(m.h)+'</b></small><div class="small">'+esc(m.t||(m.file?'Shared a file':'Shared a photo'))+'</div></div>';}).join('');

      var c=rsvpChip(e.id),d=dparts(e.date);
      gameCard='<div class="card"><div class="row"><span class="eyebrow">Next game</span><span class="chip '+c[1]+'">'+c[0]+'</span></div>'+
        '<div><div class="big">'+esc(e.title)+'</div><div>'+d.dow+', '+d.day+' · '+tfmt(e.time)+'</div><div class="muted">'+esc(e.place)+'</div></div>'+rsvpButtons(e.id)+'</div>';
    }else{
      gameCard='<div class="card"><span class="eyebrow">Next game</span><span class="muted small">No games scheduled yet. Add one in Calendar.</span></div>';
    }
    var rc=record(),recCard='<div class="card"><div class="row"><b>Team record</b><span class="chip c-no">'+rc.w+'W · '+rc.d+'D · '+rc.l+'L</span></div></div>';
    return gameCard+recCard+
      '<div class="card"><div class="row"><div><b>Events awaiting your reply</b><div class="muted small">Confirm '+esc(childName())+'\'s attendance</div></div><b style="font-size:32px;color:var(--accent)">'+pend+'</b></div></div>'+
      '<div class="card"><div class="row"><b>Team chat</b><button class="btn link" data-act="tab" data-id="chat">Open chat</button></div>'+last+'</div>'+
      (leo?'<div class="card"><b>'+esc(leo.name)+' this season</b><div class="stats4"><div><b>'+ptot(leo)+'</b><span>'+plab()+'</span></div><div><b>'+leo.g+'</b><span>Goals</span></div><div><b>'+leo.a+'</b><span>Assists</span></div><div><b>6</b><span>Games</span></div></div></div>':'<div class="card"><b>Your child</b><span class="muted small">Open Team, then Roster, and mark a player as your child to see their season here.</span></div>');
  }

  function outcome(r){return r.us>r.them?'W':r.us<r.them?'L':'D';}
  function oppName(){var e=S.liveEv?evById(S.liveEv):nextGame();return e?String(e.title).replace(/^vs\.?\s*/i,''):'Opponent';}
  function record(){
    var r={p:0,w:0,d:0,l:0,gf:0,ga:0,form:[],list:[]};
    sortedEvents().filter(function(e){return e.type==='Game'&&e.result;}).forEach(function(e){
      var o=outcome(e.result);r.p++;r.gf+=e.result.us;r.ga+=e.result.them;r[o.toLowerCase()]++;r.form.push(o);r.list.push({e:e,o:o});
    });
    return r;
  }
  var OCLS={W:'c-ok',D:'c-no',L:'c-red'};
  function teamStats(){
    var r=record(),gd=r.gf-r.ga,rate=r.p?Math.round(r.w/r.p*100):0;
    function tile(v,l){return '<div><b>'+v+'</b><span>'+l+'</span></div>';}
    var top=function(f){var b=null;S.players.forEach(function(p){if(p[f]>0&&(!b||p[f]>b[f]))b=p;});return b;};
    var ts=top('g'),ta=top('a');
    var recent=r.list.slice().reverse().slice(0,5).map(function(x){
      var d=dparts(x.e.date);
      return '<div class="log"><small style="width:52px">'+d.day+'</small><span class="chip '+OCLS[x.o]+'">'+x.o+' '+x.e.result.us+'–'+x.e.result.them+'</span><span>'+esc(x.e.title)+'</span></div>';
    }).join('');
    return '<div class="card"><b>Team record</b>'+
      '<div class="stats4">'+tile(r.w,'Won')+tile(r.d,'Drawn')+tile(r.l,'Lost')+tile(r.p,'Played')+'</div>'+
      '<div class="stats4">'+tile(r.gf,'Goals for')+tile(r.ga,'Goals against')+tile((gd>0?'+':'')+gd,'Goal diff.')+tile(rate+'%','Win rate')+'</div>'+
      (r.form.length?'<div class="tags"><span class="small muted">Last results</span>'+r.form.slice(-5).map(function(o){return '<span class="chip '+OCLS[o]+'">'+o+'</span>';}).join('')+'</div>':'<span class="muted small">No results yet. They appear when you end a game or enter a score on the event.</span>')+
      (ts||ta?'<div class="small muted">'+(ts?'Top scorer: <b>'+esc(ts.name)+'</b> ('+ts.g+')':'')+(ts&&ta?' · ':'')+(ta?'Most assists: <b>'+esc(ta.name)+'</b> ('+ta.a+')':'')+'</div>':'')+
      '</div>'+(recent?'<span class="eyebrow">Recent results</span><div style="display:flex;flex-direction:column;gap:6px">'+recent+'</div>':'');
  }

  function cal(){
    if(S.evEdit!==null)return eventForm();
    var staff=S.role==='staff';
    var head=staff?'<div class="row"><span class="muted small">Coach and team manager can add and edit events.</span><button class="btn primary" style="flex:none;white-space:nowrap" data-act="evnew">Add event</button></div>':'<span class="muted small">Reply for '+esc(childName())+'. The coach sees who is coming.</span>';
    var all=sortedEvents(),up=all.filter(function(e){return !e.result;}),past=all.filter(function(e){return e.result;}).reverse();
    function card(e){
      var c=rsvpChip(e.id),d=dparts(e.date),open=e.duties.filter(function(x){return !x.who;}).length;
      var typeCls=e.type==='Game'?'c-dark':e.type==='Event'?'c-assist':'c-no';
      var mid;
      if(e.result){var o=outcome(e.result);mid='<span class="chip '+OCLS[o]+'">'+o+' '+e.result.us+'–'+e.result.them+'</span>';}
      else{mid='<span class="chip '+c[1]+'">'+c[0]+'</span>'+(e.duties.length?'<span class="chip '+(open?'c-wait':'c-ok')+'">'+(open?open+' volunteer spot'+(open>1?'s':'')+' open':'Volunteer spots filled')+'</span>':'');}
      return '<div class="card"><div class="ev"><div class="date"><em>'+d.dow+'</em><b>'+d.day+'</b></div><div>'+
        '<div class="tags"><span class="chip '+typeCls+'">'+esc(e.type)+'</span>'+mid+'</div>'+
        '<b>'+esc(e.title)+'</b><span class="muted small">'+tfmt(e.time)+(e.place?' · '+esc(e.place):'')+'</span>'+(e.notes?'<span class="small" style="white-space:pre-line">'+esc(e.notes)+'</span>':'')+'</div></div>'+
        (e.result?'':rsvpButtons(e.id))+(staff?'<button class="btn" data-act="evedit" data-id="'+e.id+'">Edit event</button>':'')+'</div>';
    }
    return head+(up.length?up.map(card).join(''):'<div class="card"><span class="muted small">No upcoming events.</span></div>')+
      (past.length?'<span class="eyebrow">Results</span>'+past.map(card).join(''):'');
  }

    function ta(id,label,v,ph,max,single,count){return '<label class="fld"><span>'+label+'</span><textarea id="'+id+'" rows="1" maxlength="'+max+'" data-grow="1"'+(single?' data-single="1"':'')+' placeholder="'+ph+'">'+esc(v)+'</textarea>'+(count?'<span class="cnt" id="'+id+'-n">'+String(v).length+'/'+max+'</span>':'')+'</label>';}

      '<div class="card"><b>Final score</b><span class="muted small">Games only. Leave empty if it has not been played. Ending a game in Game day fills this in.</span><div class="two"><label class="fld"><span>Us</span><input id="e-us" type="number" min="0" inputmode="numeric" value="'+(e.result?e.result.us:'')+'"></label><label class="fld"><span>Them</span><input id="e-them" type="number" min="0" inputmode="numeric" value="'+(e.result?e.result.them:'')+'"></label></div></div>'+
      '<div id="e-err" class="note" style="background:var(--red-soft);color:var(--red-ink)" hidden></div>'+
      '<div class="two"><button class="btn primary" data-act="evsave">Save</button><button class="btn" data-act="evcancel">Cancel</button></div>'+
      (isNew?'':'<button class="btn" style="color:var(--red-ink)" data-act="evdel">'+(S.evDel?'Tap again to delete this event':'Delete event')+'</button>');
  }
  function saveEvent(){
    var title=val('e-title').replace(/\s*[\r\n]+\s*/g,' '),date=val('e-date'),time=val('e-time'),er=document.getElementById('e-err');
    var us=val('e-us'),th=val('e-them');
    var msg=!title?'Enter a title.':!date?'Pick a date.':!time?'Pick a time.':((us===''&&th!=='')||(us!==''&&th===''))?'Enter both scores or leave both empty.':(us!==''&&(isNaN(+us)||isNaN(+th)||+us<0||+th<0))?'Scores must be numbers from 0 up.':'';
    if(msg){if(er){er.textContent=msg;er.hidden=false;}return false;}
    var e;
    if(S.evEdit==='new'){e={id:'e'+(S.nextEv++),duties:[]};S.events.push(e);}else{e=evById(S.evEdit);}
    e.type=val('e-type');e.title=title;e.date=date;e.time=time;e.place=val('e-place').replace(/\s*[\r\n]+\s*/g,' ');e.notes=val('e-notes');
    if(e.type==='Game'&&us!==''&&th!==''){e.result={us:parseInt(us,10),them:parseInt(th,10)};}else{delete e.result;}
    S.evEdit=null;S.evDel=false;return true;
  }

    var staff=S.role==='staff',people=dutyPeople();
    var evs=sortedEvents().filter(function(e){return !e.result&&(staff||e.duties.length);});
    var head=staff?'Add volunteer spots to any event and assign them, or let families sign up for open spots.':'Sign up for open spots. Tap Cancel to give one back.';
    return '<span class="muted small">'+head+'</span>'+(evs.length?evs.map(function(e){
      var d=dparts(e.date);
      var rows=e.duties.map(function(x){
        var who=x.who,mine=who===ME,right;
        if(staff){
          var opts=people.slice();if(who&&opts.indexOf(who)<0)opts.push(who);
          right='<select class="dsel" data-assign="'+x.id+'" aria-label="Assign '+esc(x.label)+'"><option value="">Open</option>'+opts.map(function(p){return '<option'+(p===who?' selected':'')+'>'+esc(p)+'</option>';}).join('')+'</select>'+
            '<button class="btn" data-act="dutydel" data-id="'+x.id+'" aria-label="Remove '+esc(x.label)+' spot">✕</button>';
        }else if(!who){right='<button class="btn primary" data-act="duty" data-id="'+x.id+'">Sign up</button>';}

      }).join('');
      var add=staff?'<div class="compose"><input id="add-'+e.id+'" list="duty-presets" type="text" aria-label="New volunteer spot for '+esc(e.title)+'" placeholder="Add a spot, e.g. Snacks"><button class="btn" data-act="dutyadd" data-id="'+e.id+'">Add spot</button></div>':'';

    }).join(''):'<div class="card"><span class="muted small">No volunteer spots yet.</span></div>')+
      '<datalist id="duty-presets"><option value="Snacks"><option value="Water"><option value="Field setup"><option value="Scorekeeper"><option value="Team photos"></datalist>';
  }

    var clockCard=qmode()?

      '<div class="wrap"><button class="btn" data-act="speed">'+(S.speed===1?'Fast demo x30':'Real time')+'</button><button class="btn" data-act="finish">End game</button><button class="btn link" data-act="reset">Reset demo</button></div>';

      '<span class="eyebrow" style="margin-top:4px">Formation</span><div class="wrap">'+formsFor(S.fieldSize).map(function(f){return '<button class="btn'+(S.form[S.fieldSize]===f?' on-dark':'')+'" data-act="form" data-id="'+f+'">'+f+'</button>';}).join('')+'</div>'+
      '<div class="compose"><input id="form-new" type="text" aria-label="New formation" placeholder="Add formation, e.g. 4-2-3-1"><button class="btn" data-act="formadd">Add</button></div>'+
      '<div id="form-err" class="small" style="color:var(--red-ink)" hidden></div>'+
      '<span class="muted" style="font-size:12px">Numbers must add up to '+(S.fieldSize-1)+' (the goalkeeper is not counted).</span>'+

      (S.players.length<S.fieldSize?'<span class="small" style="color:var(--warn-ink)">Your roster has '+S.players.length+' players. Add more in Team to fill the field.</span>':'')+'</div>'+

      (sel?'<div class="act"><b>#'+sel.num+' '+esc(sel.name)+'</b>'+acts+'<button class="btn" data-act="do" data-id="bench">Move to bench (no replacement)</button></div>':'')+
      pitch()+
      '<span class="eyebrow">Bench ('+bench.length+')</span><div style="display:flex;flex-direction:column;gap:8px">'+(bench.length?bench.map(function(p,i){return row(p,i,false);}).join(''):'<span class="muted small">Everyone is on the field.</span>')+'</div>'+
      (started()?'<span class="eyebrow">'+plab()+' on the field ('+onP.length+')</span><div style="display:flex;flex-direction:column;gap:8px">'+onP.map(function(p,i){return row(p,i,true);}).join('')+'</div>':'')+
      savedCard()+
      '<span class="eyebrow">Game log</span><div style="display:flex;flex-direction:column;gap:6px">'+
      (S.log.length?S.log.map(function(l){return '<div class="log"><small>'+llab(l)+'</small><span class="chip '+L[l.type][1]+'">'+L[l.type][0]+'</span><span>'+esc(l.text)+'</span></div>';}).join(''):'<span class="muted small">No events yet.</span>')+'</div>';

  var REACT=[['👍','thumbs up'],['❤️','heart'],['😂','laugh'],['👏','clap'],['🙏','thanks'],['⚽','ball']];
  function takeReply(){var r=S.reply;S.reply=null;S.selMsg=null;return r;}
  function linkify(t){

  function fsize(n){return n<1024?n+' B':n<1048576?Math.round(n/1024)+' KB':(n/1048576).toFixed(1)+' MB';}
  function chatErr(m){var er=document.getElementById('c-err');if(er){er.textContent=m;er.hidden=!m;}}
  function addFile(f){
    if(!f)return;
    if(/^image\//.test(f.type)){addPhoto(f);return;}
    var ext=(f.name.split('.').pop()||'').toLowerCase();
    if(['pdf','doc','docx','xls','xlsx','csv','txt','ppt','pptx'].indexOf(ext)<0){chatErr('This file type is not allowed. Use PDF, Word, Excel, PowerPoint, CSV or text.');return;}
    if(f.size>10*1048576){chatErr('The file is larger than 10 MB.');return;}
    (S.msgs[S.chan]=S.msgs[S.chan]||[]).push({w:'You',t:(S.draft||'').trim(),file:{name:f.name,kind:ext.toUpperCase(),size:fsize(f.size)},h:'Now',me:1,reply:takeReply()});
    S.draft='';render();
  }
  function positionsCard(){
    return '<div class="card"><b>Positions</b><span class="muted small">Only the coaching staff sees and assigns positions. Add the ones you use.</span>'+
      '<div class="wrap">'+S.positions.map(function(x){return '<button class="btn" data-act="posdel" data-id="'+esc(x)+'" aria-label="Remove position '+esc(x)+'">'+esc(x)+' ✕</button>';}).join('')+'</div>'+
      '<div class="compose"><input id="pos-new" type="text" maxlength="14" aria-label="New position" placeholder="e.g. Left wing"><button class="btn" data-act="posadd">Add</button></div></div>';

  function addPhoto(file){
    if(!file||!/^image\//.test(file.type))return;
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var sc=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        (S.msgs[S.chan]=S.msgs[S.chan]||[]).push({w:'You',t:(S.draft||'').trim(),img:c.toDataURL('image/jpeg',0.8),h:'Now',me:1,reply:takeReply()});
        S.draft='';render();
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(file);
  }
  function grow(t){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px';}

    document.getElementById('title').textContent=(S.tab==='cal'&&S.evEdit!==null)?(S.evEdit==='new'?'New event':'Edit event'):(S.tab==='team'&&S.edit!==null)?(S.edit==='new'?'New player':'Player'):TITLES[S.tab];
    document.querySelectorAll('textarea[data-grow]').forEach(grow);
    var rb=document.getElementById('rolebtn');if(rb)rb.textContent=S.role==='staff'?'Viewing as: Coach / manager':'Viewing as: Parent';

    document.getElementById('nav').innerHTML=TABS.map(function(t){
      return '<button data-act="tab" data-id="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+' aria-label="'+t[1]+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+t[2]+'</svg><span>'+t[1]+'</span></button>';
    }).join('');

  function tick(){
    if(!S.running)return;
    S.sec+=S.speed;
    S.players.forEach(function(p){if(p.on)p.sec+=S.speed;});
    if(S.tab!=='game')return;
    var c=document.getElementById('clock');if(c)c.textContent=fmt(S.sec);
    var max=Math.max.apply(null,[1].concat(S.players.map(function(p){return p.sec;})));
    S.players.forEach(function(p){
      var t=document.querySelector('[data-t="'+p.id+'"]'),b=document.querySelector('[data-b="'+p.id+'"]');
      if(t)t.textContent=fmt(p.sec);if(b)b.style.width=Math.round(p.sec/max*100)+'%';
    });

  function clearSel(){S.sel=null;S.selBench=null;S.selSlot=null;}
  function logSub(t){if(started())S.log.unshift({min:minute(),q:S.qtr,type:'sub',text:t});}
  function placeIn(bp,idx){
    var occ=slotPlayer(idx);
    if(occ){occ.on=false;occ.slot=null;}
    bp.on=true;bp.slot=idx;return occ;
  }
  function doAction(type){
    if(S.sel===null||S.finished)return;
    var p=player(S.sel);
    if(!p){clearSel();return;}
    if(type==='bench'){p.on=false;p.slot=null;logSub(p.name+' to the bench');clearSel();return;}
    if(!started())return;
    var f={goal:'g',assist:'a',yellow:'y',red:'r'}[type];
    p[f]+=1;S.log.unshift({min:minute(),q:S.qtr,type:type,text:'#'+p.num+' '+p.name,pid:p.id});clearSel();
  }
  function tapPlayer(id){
    if(S.finished)return;var p=player(id);if(!p)return;
    if(p.on){
      if(S.selBench!==null){var bp=player(S.selBench);var idx=p.slot;p.on=false;p.slot=null;bp.on=true;bp.slot=idx;logSub(p.name+' out, '+bp.name+' in');clearSel();return;}
      if(S.selSlot!==null){p.slot=S.selSlot;clearSel();return;}
      if(S.sel!==null&&S.sel!==id){var q=player(S.sel),t=q.slot;q.slot=p.slot;p.slot=t;clearSel();return;}
      var was=S.sel===id;clearSel();if(!was)S.sel=id;return;
    }
    if(S.selSlot!==null){placeIn(p,S.selSlot);logSub(p.name+' to the field');clearSel();return;}
    if(S.sel!==null){var out=player(S.sel),i2=out.slot;out.on=false;out.slot=null;p.on=true;p.slot=i2;logSub(out.name+' out, '+p.name+' in');clearSel();return;}
    var wasB=S.selBench===id;clearSel();if(!wasB)S.selBench=id;
  }
  function tapSlot(idx){
    if(S.finished)return;var occ=slotPlayer(idx);
    if(S.selBench!==null){
      var bp=player(S.selBench),o=placeIn(bp,idx);
      logSub(o?o.name+' out, '+bp.name+' in':bp.name+' to the field');clearSel();return;
    }
    if(S.sel!==null){
      var sp=player(S.sel);
      if(occ&&occ.id===sp.id){clearSel();return;}
      if(occ){var t=sp.slot;sp.slot=occ.slot;occ.slot=t;}else{sp.slot=idx;}
      clearSel();return;
    }
    if(S.selSlot!==null){
      if(S.selSlot===idx){clearSel();return;}
      if(occ){clearSel();S.sel=occ.id;return;}
      S.selSlot=idx;return;
    }
    if(occ){S.sel=occ.id;}else{S.selSlot=idx;}
  }
  function trimSlots(){
    var n=slots().length;
    S.players.forEach(function(p){if(p.on&&p.slot>=n){p.on=false;p.slot=null;}});
    clearSel();
  }
  function saveLineup(){
    var nm=val('lu-name')||('Lineup '+(S.saved.length+1)),a={};
    S.players.forEach(function(p){if(p.on&&p.slot!==null)a[p.slot]=p.id;});
    S.saved.push({id:S.nextLu++,name:nm,fieldSize:S.fieldSize,formation:S.form[S.fieldSize],assign:a});
  }
  function loadLineup(id){
    var l=S.saved.filter(function(x){return x.id===id;})[0];if(!l||started())return;
    S.players.forEach(function(p){p.on=false;p.slot=null;});
    S.fieldSize=l.fieldSize;S.form[l.fieldSize]=l.formation;
    if(formsFor(l.fieldSize).indexOf(l.formation)<0)S.customForms[l.fieldSize].push(l.formation);
    var n=slots().length;
    Object.keys(l.assign).forEach(function(k){
      var i=parseInt(k,10),p=player(l.assign[k]);
      if(p&&i<n){p.on=true;p.slot=i;}
    });
    clearSel();
  }
  function resetGame(){
    S.players.forEach(function(p,i){
      var mine=S.log.filter(function(l){return l.pid===p.id;});
      ['goal','assist','yellow','red'].forEach(function(t){
        var n=mine.filter(function(l){return l.type===t;}).length,f={goal:'g',assist:'a',yellow:'y',red:'r'}[t];p[f]-=n;
      });
      p.on=false;p.slot=null;p.sec=0;p.q=0;
    });
    var lv=S.liveEv?evById(S.liveEv):null;if(lv&&lv.result&&lv.result.live)delete lv.result;
    S.liveEv=null;S.running=false;S.finished=false;S.sec=0;S.qtr=1;S.qon=false;S.opp=0;S.log=[];clearSel();
  }
  function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}
  function savePlayer(){
    var name=val('f-name');
    if(!name){var er=document.getElementById('f-err');if(er){er.textContent='Enter the player name.';er.hidden=false;}return false;}
    var num=parseInt(val('f-num'),10);if(isNaN(num))num=0;
    var mine=document.getElementById('f-mine').checked,p;
    if(S.edit==='new'){p={id:S.nextId++,season:0,g:0,a:0,y:0,r:0,on:false,slot:null,sec:0,q:0,sq:0};S.players.push(p);}
    else{p=player(S.edit);}
    p.name=name;p.num=num;var fp=document.getElementById('f-pos');if(fp)p.pos=fp.value;p.guardian=val('f-guardian');p.email=val('f-email');p.phone=val('f-phone');
    if(mine){S.players.forEach(function(x){x.mine=(x===p);});}else{p.mine=false;}
    S.edit=null;S.confirmDel=false;return true;
  }
  function send(){
    var t=(S.draft||'').trim();if(!t)return;

    var i=document.getElementById('draft');if(i)i.focus();
  }

  document.addEventListener('click',function(ev){
    var el=ev.target.closest('[data-act]');if(!el)return;
    var a=el.getAttribute('data-act'),id=el.getAttribute('data-id'),v=el.getAttribute('data-v');
    if(a==='tab'){S.tab=id;S.edit=null;S.confirmDel=false;S.evEdit=null;S.evDel=false;window.scrollTo(0,0);}
    else if(a==='rsvp'){S.rsvp[id]=S.rsvp[id]===v?'pending':v;}
    else if(a==='role'){S.role=S.role==='staff'?'parent':'staff';S.evEdit=null;S.evDel=false;S.edit=null;S.confirmDel=false;clearSel();window.scrollTo(0,0);}
    else if(a==='evnew'){S.evEdit='new';S.evDel=false;window.scrollTo(0,0);}
    else if(a==='evedit'){S.evEdit=id;S.evDel=false;window.scrollTo(0,0);}
    else if(a==='evcancel'){S.evEdit=null;S.evDel=false;window.scrollTo(0,0);}
    else if(a==='evsave'){if(!saveEvent())return;window.scrollTo(0,0);}
    else if(a==='evdel'){
      if(!S.evDel){S.evDel=true;}
      else{var eid=S.evEdit;S.events=S.events.filter(function(e){return e.id!==eid;});delete S.rsvp[eid];S.evEdit=null;S.evDel=false;window.scrollTo(0,0);}
    }
    else if(a==='dutyadd'){
      var inp=document.getElementById('add-'+id),lab=inp?inp.value.trim():'';if(!lab)return;
      var evt=evById(id);if(evt)evt.duties.push({id:'d'+(S.nextDuty++),label:lab,who:null});
    }
    else if(a==='dutydel'){S.events.forEach(function(e){e.duties=e.duties.filter(function(x){return x.id!==id;});});}
    else if(a==='chan'){S.chan=id;S.chatNew=false;S.chatDel=false;}
    else if(a==='file'){var fi=document.getElementById('file');if(fi)fi.click();return;}
    else if(a==='msel'){var n=parseInt(id,10);S.selMsg=(S.selMsg===n?null:n);}
    else if(a==='mreply'){var mm=(S.msgs[S.chan]||[])[parseInt(id,10)];if(mm){S.reply={w:mm.w,t:(mm.t||(mm.img?'Photo':mm.file?mm.file.name:'')).slice(0,80)};}S.selMsg=null;}
    else if(a==='mrcancel'){S.reply=null;}
    else if(a==='mre'){var m2=(S.msgs[S.chan]||[])[parseInt(id,10)];var em=REACT[parseInt(el.getAttribute('data-k'),10)][0];if(m2){m2.re=m2.re||[];var xi=m2.re.indexOf(em);if(xi>=0)m2.re.splice(xi,1);else m2.re.push(em);}}
    else if(a==='posadd'){var np=val('pos-new');if(!np||S.positions.some(function(x){return x.toLowerCase()===np.toLowerCase();}))return;S.positions.push(np);}
    else if(a==='posdel'){S.positions=S.positions.filter(function(x){return x!==id;});S.players.forEach(function(p){if(p.pos===id)p.pos='';});}
    else if(a==='mdel'){var arr=S.msgs[S.chan]||[],ix=parseInt(id,10);if(arr[ix]&&(S.role==='staff'||arr[ix].me))arr.splice(ix,1);S.selMsg=null;}
    else if(a==='gnew'){S.chatNew=true;window.scrollTo(0,0);}
    else if(a==='gcancel'){S.chatNew=false;window.scrollTo(0,0);}
    else if(a==='gall'||a==='gnone'){document.querySelectorAll('input[data-mem]').forEach(function(i){i.checked=(a==='gall');});return;}
    else if(a==='gcreate'){if(!createGroup())return;window.scrollTo(0,0);}
    else if(a==='gdel'){
      if(!S.chatDel){S.chatDel=true;}
      else{var gid=S.chan;S.chats=S.chats.filter(function(c){return c.id!==gid;});delete S.msgs[gid];S.chan='team';S.chatDel=false;}
    }
    else if(a==='send'){send();return;}
    else if(a==='tv'){S.teamView=id;S.edit=null;}
    else if(a==='edit'){S.edit=id==='new'?'new':parseInt(id,10);S.confirmDel=false;window.scrollTo(0,0);}
    else if(a==='cancel'){S.edit=null;S.confirmDel=false;window.scrollTo(0,0);}
    else if(a==='save'){if(!savePlayer())return;window.scrollTo(0,0);}
    else if(a==='del'){
      if(!S.confirmDel){S.confirmDel=true;}
      else{var did=S.edit;S.players=S.players.filter(function(p){return p.id!==did;});S.log=S.log.filter(function(l){return l.pid!==did;});clearSel();S.edit=null;S.confirmDel=false;window.scrollTo(0,0);}
    }
    else if(a==='fs'){S.fieldSize=parseInt(id,10);trimSlots();}
    else if(a==='form'){S.form[S.fieldSize]=id;}
    else if(a==='formadd'){
      var raw=val('form-new').replace(/\s+/g,''),fe=document.getElementById('form-err'),need=S.fieldSize-1;
      var fok=/^\d+(-\d+){1,4}$/.test(raw),parts=fok?raw.split('-').map(Number):[],sum=parts.reduce(function(x,y){return x+y;},0),fmsg='';
      if(!fok)fmsg='Use numbers separated by dashes, like 4-2-3-1.';
      else if(parts.some(function(n){return n<1;}))fmsg='Each line needs at least one player.';
      else if(sum!==need)fmsg='The numbers add up to '+sum+', but '+S.fieldSize+' v '+S.fieldSize+' needs '+need+' plus the goalkeeper.';
      else if(formsFor(S.fieldSize).indexOf(raw)>=0)fmsg='That formation already exists.';
      if(fmsg){if(fe){fe.textContent=fmsg;fe.hidden=false;}return;}
      S.customForms[S.fieldSize].push(raw);S.form[S.fieldSize]=raw;
    }
    else if(a==='formdel'){var cur=S.form[S.fieldSize];S.customForms[S.fieldSize]=S.customForms[S.fieldSize].filter(function(x){return x!==cur;});S.form[S.fieldSize]=FORMS[S.fieldSize][0];}
    else if(a==='slot'){tapSlot(parseInt(id,10));}
    else if(a==='lsave'){saveLineup();}
    else if(a==='lload'){loadLineup(parseInt(id,10));}
    else if(a==='ldel'){var lid=parseInt(id,10);S.saved=S.saved.filter(function(l){return l.id!==lid;});}
    else if(a==='duty'){S.events.forEach(function(e){e.duties.forEach(function(x){if(x.id===id){if(!x.who)x.who=ME;else if(x.who===ME)x.who=null;}});});}
    else if(a==='run'){if(!S.finished){if(!S.running&&!started()&&onCount()===0)return;
        if(!S.running&&!started()){var ng=nextGame();S.liveEv=ng?ng.id:null;}
        S.running=!S.running;}}
    else if(a==='tmode'){if(!started()&&(id==='min'||id==='qtr'))S.tmode=id;}
    else if(a==='qstart'){if(!S.finished&&!started()&&onCount()>0){S.qon=true;var ng2=nextGame();S.liveEv=ng2?ng2.id:null;}}
    else if(a==='qnext'){if(!S.finished&&qmode()&&started()){
        S.players.forEach(function(p){if(p.on)p.q+=1;});
        S.log.unshift({min:0,q:S.qtr,type:'qend',text:'Q'+S.qtr+' ended'});clearSel();
        if(S.qtr<4){S.qtr+=1;}
        else{if(S.liveEv){var le2=evById(S.liveEv);if(le2)le2.result={us:S.log.filter(function(l){return l.type==='goal';}).length,them:S.opp,live:true};}S.running=false;S.finished=true;}
      }}
    else if(a==='speed'){S.speed=S.speed===1?30:1;}
    else if(a==='finish'){
      if(!S.finished&&S.liveEv){var le=evById(S.liveEv);if(le)le.result={us:S.log.filter(function(l){return l.type==='goal';}).length,them:S.opp,live:true};}
      S.running=false;S.finished=true;clearSel();
    }
    else if(a==='reset'){resetGame();}
    else if(a==='opp'){if(!S.finished){S.opp+=1;S.log.unshift({min:minute(),q:S.qtr,type:'opp',text:oppName()+' goal'});}}
    else if(a==='do'){doAction(id);}
    else if(a==='tap'){tapPlayer(parseInt(id,10));}
    render();
  });
  document.addEventListener('change',function(ev){
    var t=ev.target,did=t&&t.getAttribute?t.getAttribute('data-assign'):null;
    if(t&&t.id==='file'){addFile(t.files&&t.files[0]);t.value='';return;}
    if(!did)return;
    S.events.forEach(function(e){e.duties.forEach(function(x){if(x.id===did)x.who=t.value||null;});});
    render();
  });
  document.addEventListener('input',function(ev){
    var t=ev.target;if(!t)return;
    if(t.id==='draft')S.draft=t.value;
    if(t.tagName==='TEXTAREA'&&t.hasAttribute('data-grow')){
      if(t.hasAttribute('data-single')&&/[\r\n]/.test(t.value))t.value=t.value.replace(/\s*[\r\n]+\s*/g,' ');
      grow(t);var c=document.getElementById(t.id+'-n');if(c)c.textContent=t.value.length+'/'+t.maxLength;
    }
  });
  document.addEventListener('keydown',function(ev){
    if(ev.key==='Enter'&&ev.target&&ev.target.hasAttribute&&ev.target.hasAttribute('data-single')){ev.preventDefault();return;}if(ev.key==='Enter'&&ev.target&&ev.target.id==='draft'){ev.preventDefault();send();}});

  setInterval(tick,1000);
  render();
})();
</script>
</body></html>
